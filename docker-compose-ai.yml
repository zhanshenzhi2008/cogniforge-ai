# =============================================================================
# cogniforge-ai 生产部署
# 部署位置：/opt/project/cogniforge/docker-compose-ai.yml
# 单部署根目录：三个仓的 compose 都集中到 /opt/project/cogniforge/
# 数据库：经 external 网络 db-net 访问 pgsql（pgvector）；LLM 一律回调 Go，不读 API Key
# 注意：AI 服务不直接对外，由 Go 后端代理访问
# 配置：全部走同级 .env（env_file）；监听地址见 Dockerfile CMD（0.0.0.0:8086）
# =============================================================================

services:
  cogniforge-ai:
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/cogniforge-ai:latest
    container_name: cogniforge-ai
    restart: unless-stopped
    mem_limit: ${AI_MEM_LIMIT:-512m}
    mem_reservation: ${AI_MEM_RESERVATION:-256m}
    cpus: ${AI_CPUS:-1.0}
    expose:
      - "8086"
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - cogniforge-net
      - db-net           # ← 连接公用数据库网络
    labels:
      - "traefik.enable=false"   # AI 服务不直接对外，由 Go 后端代理
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8086/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cogniforge-net:
    external: true
    name: cogniforge-net
  db-net:
    external: true
    name: db-net
