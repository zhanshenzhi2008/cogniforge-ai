| =============================================================================
# cogniforge-ai 生产部署
# 部署位置：/opt/project/cogniforge/docker-compose-ai.yml
# 单部署根目录：三个仓的 compose 都集中到 /opt/project/cogniforge/
# 数据库：连接 ../envs/db.env（共享 db-net 寻址 db-postgres）
# AI Provider keys：../envs/llm.env（共享）
# 注意：AI 服务不直接对外，由 Go 后端代理访问
# =============================================================================

services:
  cogniforge-ai:
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/cogniforge/cogniforge-ai:latest
    container_name: cogniforge-ai
    restart: unless-stopped
    expose:
      - "8086"
    env_file:
      # 本服务私有配置
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8086
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - cogniforge-net
      - db-net           # ← 连接公用数据库网络
    labels:
      - "traefik.enable=false"   # AI 服务不直接对外，由 Go 后端代理
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8086/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cogniforge-net:
    external: true
    name: cogniforge-net
  db-net:
    external: true
    name: db-net
