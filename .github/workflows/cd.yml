# =============================================================================
# GitHub Actions CD 模板：cogniforge-ai (Python)
# 适用：GitHub 构建镜像 → 服务器 docker pull
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 防并发部署
concurrency:
  group: deploy-cogniforge-ai-${{ github.ref }}
  cancel-in-progress: false

env:
  # ── 镜像仓库（env，公开信息）───────────────────────────────
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_PROJECT: cogniforge
  IMAGE_NAME: cogniforge-ai

  # ── 服务器部署路径 ──────────────────────────────────────────
  DEPLOY_PATH: /opt/project/cogniforge
  COMPOSE_FILE: docker-compose-ai.yml
  COMPOSE_SERVICES: cogniforge-ai

jobs:
  # ---------------------------------------------------------------------------
  # 构建 + 推送镜像
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    environment: xcy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.IMAGE_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 部署到远程服务器（git pull 镜像 + docker compose up）
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: xcy

    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          timeout: 15m
          command_timeout: 15m
          envs: DEPLOY_PATH,COMPOSE_FILE,COMPOSE_SERVICES,IMAGE_REGISTRY,IMAGE_NAMESPACE,IMAGE_PROJECT,IMAGE_NAME
          script: |
            set -e
            export DOCKER_CLI_HINTS=false
            echo "=== SSH OK $(whoami)@$(hostname) ==="

            # ── 登录镜像仓库 ─────────────────────────────────────
            echo "${{ secrets.IMAGE_REGISTRY_TOKEN }}" | docker login $IMAGE_REGISTRY -u "${{ github.actor }}" --password-stdin

            # ── 确保网络存在 ─────────────────────────────────────
            docker network inspect db-net >/dev/null 2>&1 || {
              echo "ERROR: db-net 不存在，请先确保 PostgreSQL/Redis 已部署"
              exit 1
            }
            docker network inspect cogniforge-net >/dev/null 2>&1 || \
              docker network create cogniforge-net

            # ── 验证部署目录 ──────────────────────────────────────
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "ERROR: 部署目录 $DEPLOY_PATH 不存在"
              exit 1
            fi
            if [ ! -f "$DEPLOY_PATH/$COMPOSE_FILE" ]; then
              echo "ERROR: $DEPLOY_PATH/$COMPOSE_FILE 不存在"
              exit 1
            fi

            # ── 拉取镜像 ─────────────────────────────────────────
            IMAGE_FULL="$IMAGE_REGISTRY/$IMAGE_NAMESPACE/$IMAGE_PROJECT/$IMAGE_NAME"
            echo "拉取镜像: ${IMAGE_FULL}:${{ github.sha }}"
            docker compose -f "$DEPLOY_PATH/$COMPOSE_FILE" pull $COMPOSE_SERVICES

            # ── 重打 tag（latest 供 compose 使用）────────────────
            docker tag "${IMAGE_FULL}:${{ github.sha }}" "${IMAGE_FULL}:latest"

            # ── 重启容器 ─────────────────────────────────────────
            docker compose -f "$DEPLOY_PATH/$COMPOSE_FILE" up -d --no-deps $COMPOSE_SERVICES

            echo "等待 15s 让服务启动..."
            sleep 15

            echo "=== 容器状态 ==="
            docker compose -f "$DEPLOY_PATH/$COMPOSE_FILE" ps $COMPOSE_SERVICES
            docker compose -f "$DEPLOY_PATH/$COMPOSE_FILE" logs --tail=20 $COMPOSE_SERVICES

            # ── 清理旧镜像 ───────────────────────────────────────
            docker image prune -f --filter "until=72h" || true

      - name: Notify on failure
        if: failure()
        run: |
          echo " Deploy failed"
