[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cogniforge-ai"
version = "1.0.0"
description = "AI service for Cogniforge - Agent, LLM, RAG, and Memory"
authors = [{name = "cogniforge"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agent", "llm", "rag", "openai", "anthropic", "openrouter", "vector-search", "pgvector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "typing_extensions>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    # LLM Providers
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "openrouter>=0.9.0",
    # HTTP Client
    "httpx>=0.24.0",
    # Model config cache
    "cachetools>=5.3.0",
    "redis>=5.0.0",
    # Document Parsers
    "pypdf>=3.0.0",
    "python-docx>=0.8.0",
    # Vector Store
    "psycopg2-binary>=2.9.0",
    # Logging
    "colorlog>=6.8.0",
    # Observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b1",
    "opentelemetry-instrumentation-httpx>=0.49b1",
    "opentelemetry-propagator-b3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
local-embed = ["sentence-transformers>=2.0.0"]
redis = ["redis>=5.0.0"]
tracing = ["opentelemetry-exporter-jaeger>=1.20.0"]
